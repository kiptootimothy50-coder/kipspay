workflows:
  android-workflow:
    name: KipsPay AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/*.aab
    publishing:
      email:
        recipients:
          - kiptootimothy50@gmail.com
